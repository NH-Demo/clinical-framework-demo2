name: Stale Clinical Review Escalation

on:
  # Runs automatically every weekday at 08:00 UTC (09:00 / 10:00 Swedish time)
  schedule:
    - cron: '0 8 * * 1-5'
  # Allows manual testing anytime via GitHub Actions UI
  workflow_dispatch:

jobs:
  check-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Scan Stale Issues and Alert Teams
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          REPO="${{ github.repository }}"
          # Threshold date: 7 days ago in ISO 8601 format
          STALE_DATE=$(date -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)

          echo "Checking issues untouched since $STALE_DATE..."

          # Fetch open issues updated before the stale date
          STALE_ISSUES=$(gh api "repos/${REPO}/issues?state=open&sort=updated&direction=asc" \
            --jq "[.[] | select(.pull_request == null and .updated_at < \"$STALE_DATE\")]")

          COUNT=$(echo "$STALE_ISSUES" | jq 'length')
          echo "Found $COUNT stale issues."

          if [ "$COUNT" -eq 0 ]; then
            echo "No stale issues found. Exiting."
            exit 0
          fi

          # Loop through each stale issue and send an alert card
          echo "$STALE_ISSUES" | jq -c '.[]' | while read -r issue; do
            NUMBER=$(echo "$issue" | jq -r '.number')
            TITLE=$(echo "$issue" | jq -r '.title')
            URL=$(echo "$issue" | jq -r '.html_url')
            ASSIGNEE=$(echo "$issue" | jq -r '.assignees[0].login // "Unassigned"')
            DAYS_AGO=$(( ( $(date +%s) - $(date -d "$(echo "$issue" | jq -r '.updated_at')" +%s) ) / 86400 ))

            # Direct Teams chat deep-link for Tom to message the doctor directly in 1 click
            # (In enterprise Teams, passing the email opens the exact 1-on-1 chat)
            TEAMS_NUDGE_URL="https://teams.microsoft.com/l/chat/0/0?users=${ASSIGNEE}@nekohealth.com&message=Hi%20Dr.%20${ASSIGNEE},%20Issue%20%23${NUMBER}%20(${TITLE})%20is%20awaiting%20clinical%20review%20and%20has%20been%20inactive%20for%207%2B%20days.%20Could%20you%20please%20check%20it%20here:%20${URL}"

            PAYLOAD=$(cat <<EOF
          {
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "⚠️ Stale Review Alert: ${DAYS_AGO} Days Inactive",
                      "weight": "Bolder",
                      "size": "Medium",
                      "color": "Attention"
                    },
                    {
                      "type": "TextBlock",
                      "text": "**Issue #${NUMBER}:** ${TITLE}\n\n**Assignee:** Dr. @${ASSIGNEE}\n**Last Activity:** ${DAYS_AGO} days ago",
                      "wrap": true
                    }
                  ],
                  "actions": [
                    {
                      "type": "Action.OpenUrl",
                      "title": "Open Issue in GitHub",
                      "url": "${URL}"
                    },
                    {
                      "type": "Action.OpenUrl",
                      "title": "Nudge Doctor in 1-on-1 Teams Chat",
                      "url": "${TEAMS_NUDGE_URL}"
                    }
                  ]
                }
              }
            ]
          }
          EOF
            )

            curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL"
            sleep 1
          done
