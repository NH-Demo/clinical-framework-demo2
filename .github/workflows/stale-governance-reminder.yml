name: Stale Clinical Review Escalation

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  check-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Scan Stale Issues and Alert Teams
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          REPO="${{ github.repository }}"

          # Cutoff set to 3 days ago in UTC ISO-8601 format
          STALE_DATE=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Scanning for open issues untouched since: $STALE_DATE"

          # Fetch up to 50 open issues, filtering out Pull Requests
          STALE_ISSUES=$(gh api "repos/${REPO}/issues?state=open&sort=updated&direction=asc&per_page=50" \
            --jq "[.[] | select(.pull_request == null and .updated_at < \"$STALE_DATE\")]")

          COUNT=$(echo "$STALE_ISSUES" | jq 'length')
          echo "Discovered $COUNT stale issue(s) older than 3 days."

          if [ "$COUNT" -eq 0 ]; then
            echo "No stale issues found. Exiting."
            exit 0
          fi

          echo "$STALE_ISSUES" | jq -c '.[]' | while read -r issue; do
            NUMBER=$(echo "$issue" | jq -r '.number')
            TITLE=$(echo "$issue" | jq -r '.title')
            URL=$(echo "$issue" | jq -r '.html_url')
            UPDATED_AT=$(echo "$issue" | jq -r '.updated_at')

            ASSIGNEE=$(echo "$issue" | jq -r '.assignees[0].login // empty')
            if [ -z "$ASSIGNEE" ]; then
              ASSIGNEE_TEXT="Unassigned"
              DOCTOR_EMAIL=""
            else
              ASSIGNEE_TEXT="@${ASSIGNEE}"
              DOCTOR_EMAIL="${ASSIGNEE}@nekohealth.com"
            fi

            UPDATED_EPOCH=$(date -d "$UPDATED_AT" +%s)
            NOW_EPOCH=$(date +%s)
            DAYS_AGO=$(( (NOW_EPOCH - UPDATED_EPOCH) / 86400 ))

            MSG_TEXT="Hi Dr. ${ASSIGNEE}, Issue #${NUMBER} (${TITLE}) is awaiting clinical sign-off and has been inactive for ${DAYS_AGO} days. Could you please review it here: ${URL}"
            ENCODED_MSG=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$MSG_TEXT")
            TEAMS_NUDGE_URL="https://teams.microsoft.com/l/chat/0/0?users=${DOCTOR_EMAIL}&message=${ENCODED_MSG}"

            CARD_TITLE="⚠️ Stale Review Alert: ${DAYS_AGO} Days Inactive"
            CARD_BODY="**Issue #${NUMBER}:** ${TITLE}\n\n**Assignee:** ${ASSIGNEE_TEXT}\n**Last Updated:** ${DAYS_AGO} days ago"

            if [ -n "$DOCTOR_EMAIL" ]; then
              ACTIONS=$(jq -n \
                --arg url "$URL" \
                --arg nudge "$TEAMS_NUDGE_URL" \
                '[
                  {"type": "Action.OpenUrl", "title": "Open Issue in GitHub", "url": $url},
                  {"type": "Action.OpenUrl", "title": "Nudge Doctor in Teams", "url": $nudge}
                ]')
            else
              ACTIONS=$(jq -n \
                --arg url "$URL" \
                '[
                  {"type": "Action.OpenUrl", "title": "Open Issue in GitHub", "url": $url}
                ]')
            fi

            PAYLOAD=$(jq -n \
              --arg title "$CARD_TITLE" \
              --arg body "$CARD_BODY" \
              --argjson actions "$ACTIONS" \
              '{
                "type": "message",
                "attachments": [
                  {
                    "contentType": "application/vnd.microsoft.card.adaptive",
                    "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [
                        {
                          "type": "TextBlock",
                          "text": $title,
                          "weight": "Bolder",
                          "size": "Medium",
                          "color": "Attention"
                        },
                        {
                          "type": "TextBlock",
                          "text": $body,
                          "wrap": true
                        }
                      ],
                      "actions": $actions
                    }
                  }
                ]
              }')

            echo "Sending alert for Issue #${NUMBER} to Teams..."
            curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL"
            sleep 1
          done
