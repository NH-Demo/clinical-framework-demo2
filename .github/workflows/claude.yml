name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    # Only these commands start Claude. Any other @claude comment is ignored.
    if: >
      startsWith(github.event.comment.body, '@claude summarise outcome') ||
      startsWith(github.event.comment.body, '@claude draft pr') ||
      startsWith(github.event.comment.body, '@claude revise') ||
      startsWith(github.event.comment.body, '@claude import word')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Only for Word imports: install the tool that reads tracked changes and comments
      - name: Install pandoc
        if: startsWith(github.event.comment.body, '@claude import word')
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 15
            --allowedTools "Bash(pandoc:*),Bash(git rm:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(ls:*)"
