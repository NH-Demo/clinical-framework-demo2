name: Clinical Governance Auto-Labeler

on:
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, closed, review_requested, ready_for_review, converted_to_draft]

jobs:
  label-sync:
    runs-on: ubuntu-latest
    # Prevent concurrent runs on the exact same PR from racing each other
    concurrency:
      group: label-sync-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Update Labels
        uses: actions/github-script@v7
        with:
          script: |
            const statusLabels = [
              'status: clinical discussion',
              'status: ready for drafting',
              'status: draft in progress',
              'status: awaiting clinical review',
              'status: approved'
            ];

            async function replaceStatus(targetNumber, newLabel) {
              const repoInfo = { owner: context.repo.owner, repo: context.repo.repo, issue_number: targetNumber };
              
              const current = await github.rest.issues.get(repoInfo);
              const existing = current.data.labels.map(l => l.name);

              for (const lbl of existing) {
                if (statusLabels.includes(lbl) && lbl !== newLabel) {
                  try {
                    await github.rest.issues.removeLabel({ ...repoInfo, name: lbl });
                  } catch (e) {}
                }
              }

              if (!existing.includes(newLabel)) {
                await github.rest.issues.addLabels({ ...repoInfo, labels: [newLabel] });
              }
            }

            const event = context.eventName;
            const action = context.payload.action;

            // 1. Issues: Opened or Doctor Assigned
            if (event === 'issues' && (action === 'opened' || action === 'assigned')) {
              await replaceStatus(context.issue.number, 'status: clinical discussion');
            }

            // 2. PR Logic
            if (event === 'pull_request') {
              const pr = context.payload.pull_request;
              const prNumber = pr.number;

              // Merged
              if (action === 'closed' && pr.merged === true) {
                await replaceStatus(prNumber, 'status: approved');
              }
              // Active Draft (either opened as draft, or converted back to draft)
              else if (pr.draft === true) {
                await replaceStatus(prNumber, 'status: draft in progress');
              }
              // Ready for Review / Not a draft (opened ready, marked ready, or review requested)
              else if (action === 'opened' || action === 'ready_for_review' || action === 'review_requested') {
                await replaceStatus(prNumber, 'status: awaiting clinical review');
              }
            }
