name: Clinical Governance Auto-Labeler

on:
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, closed, review_requested]

jobs:
  label-sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Update Labels
        uses: actions/github-script@v7
        with:
          script: |
            const statusLabels = [
              'status: clinical discussion',
              'status: ready for drafting',
              'status: draft in progress',
              'status: awaiting clinical review',
              'status: approved'
            ];

            async function replaceStatus(targetNumber, newLabel) {
              const repoInfo = { owner: context.repo.owner, repo: context.repo.repo, issue_number: targetNumber };
              
              const current = await github.rest.issues.get(repoInfo);
              const existing = current.data.labels.map(l => l.name);

              for (const lbl of existing) {
                if (statusLabels.includes(lbl) && lbl !== newLabel) {
                  try {
                    await github.rest.issues.removeLabel({ ...repoInfo, name: lbl });
                  } catch (e) {}
                }
              }

              if (!existing.includes(newLabel)) {
                await github.rest.issues.addLabels({ ...repoInfo, labels: [newLabel] });
              }
            }

            const event = context.eventName;
            const action = context.payload.action;

            // 1. UI Event: Issue Opened or Doctor Assigned
            if (event === 'issues' && (action === 'opened' || action === 'assigned')) {
              await replaceStatus(context.issue.number, 'status: clinical discussion');
            }

            // 2. UI Event: Draft PR Opened by Coordinator
            if (event === 'pull_request' && action === 'opened') {
              await replaceStatus(context.payload.pull_request.number, 'status: draft in progress');
            }

            // 3. UI Event: Reviewer (Nick/Tom) Assigned on PR
            if (event === 'pull_request' && action === 'review_requested') {
              await replaceStatus(context.payload.pull_request.number, 'status: awaiting clinical review');
            }

            // 4. UI Event: PR Merged Button Clicked
            if (event === 'pull_request' && action === 'closed' && context.payload.pull_request.merged === true) {
              await replaceStatus(context.payload.pull_request.number, 'status: approved');
            }
