name: Notify Doctor Governance Events

on:
  member:
    types: [added]
  issues:
    types: [assigned]
  pull_request:
    types: [assigned, review_requested]
  workflow_dispatch:
    inputs:
      event_type:
        description: 'Choose event to test'
        required: true
        type: choice
        options:
          - 'Invitation Sent'
          - 'Doctor Joined'
          - 'Assigned to Issue'
          - 'Doctor Mentioned'
        default: 'Invitation Sent'
      doctor_name:
        description: 'Doctor username'
        required: false
        default: 'sarah.lind'
      item_title:
        description: 'Title of Issue/PR or Context'
        required: false
        default: 'Hypertension Guideline v2.1 Sign-off'
      item_url:
        description: 'Direct URL to review'
        required: false
        default: 'https://github.com/NH-Demo/clinical-framework-demo2/issues/1'

jobs:
  notify-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Send Adaptive Card Alert to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          REPO="${{ github.repository }}"
          INVITE_URL="https://github.com/${REPO}/invitations"

          # 1. Resolve Trigger Source
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EVENT_TYPE="${{ github.event.inputs.event_type }}"
            DOCTOR="${{ github.event.inputs.doctor_name }}"
            TITLE_TEXT="${{ github.event.inputs.item_title }}"
            TARGET_URL="${{ github.event.inputs.item_url }}"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            EVENT_TYPE="Assigned to Issue"
            DOCTOR="${{ github.event.assignee.login }}"
            TITLE_TEXT="${{ github.event.issue.title }}"
            TARGET_URL="${{ github.event.issue.html_url }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            EVENT_TYPE="Assigned to Issue"
            DOCTOR="${{ github.event.requested_reviewer.login || github.event.assignee.login }}"
            TITLE_TEXT="${{ github.event.pull_request.title }}"
            TARGET_URL="${{ github.event.pull_request.html_url }}"
          elif [ "${{ github.event_name }}" = "member" ]; then
            EVENT_TYPE="Doctor Joined"
            DOCTOR="${{ github.event.member.login }}"
            TITLE_TEXT=""
            TARGET_URL="https://github.com/${REPO}"
          fi

          # 2. Build Event-Specific Copy
          if [ "$EVENT_TYPE" = "Invitation Sent" ]; then
            CARD_TITLE="📋 Clinical Reviewer Access Invited"
            COLOR="Accent"
            MSG="Dr. **@${DOCTOR}** has been invited to collaborate on **${REPO}**.\n\n**Direct Link to Forward:**\n\`${INVITE_URL}\`\n\n*If Dr. @${DOCTOR} misses the GitHub email, copy the link above and drop it directly in their 1-on-1 Teams chat.*"
            BTN_TEXT="Open Acceptance Page"
            BTN_URL="${INVITE_URL}"

          elif [ "$EVENT_TYPE" = "Doctor Joined" ]; then
            CARD_TITLE="🎉 Doctor Joined Repository"
            COLOR="Good"
            MSG="Dr. **@${DOCTOR}** has accepted the invitation and is now an active reviewer on **${REPO}**."
            BTN_TEXT="Open Repository"
            BTN_URL="https://github.com/${REPO}"

          elif [ "$EVENT_TYPE" = "Assigned to Issue" ]; then
            CARD_TITLE="📌 Clinical Task Assigned"
            COLOR="Warning"
            MSG="Dr. **@${DOCTOR}**, you have been assigned as the clinical reviewer for:\n\n**${TITLE_TEXT}**\n\n**Direct Link:**\n\`${TARGET_URL}\`"
            BTN_TEXT="Open Item in GitHub"
            BTN_URL="${TARGET_URL}"

          elif [ "$EVENT_TYPE" = "Doctor Mentioned" ]; then
            CARD_TITLE="💬 Clinical Discussion Mention"
            COLOR="Accent"
            MSG="Dr. **@${DOCTOR}**, you were mentioned in a clinical discussion regarding:\n\n**${TITLE_TEXT}**\n\n**Direct Link:**\n\`${TARGET_URL}\`"
            BTN_TEXT="View Comment"
            BTN_URL="${TARGET_URL}"
          fi

          # 3. Deliver Adaptive Card to Teams
          JSON_PAYLOAD=$(cat <<EOF
          {
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "${CARD_TITLE}",
                      "weight": "Bolder",
                      "size": "Medium",
                      "color": "${COLOR}"
                    },
                    {
                      "type": "TextBlock",
                      "text": "${MSG}",
                      "wrap": true
                    }
                  ],
                  "actions": [
                    {
                      "type": "Action.OpenUrl",
                      "title": "${BTN_TEXT}",
                      "url": "${BTN_URL}"
                    }
                  ]
                }
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "$TEAMS_WEBHOOK_URL"
