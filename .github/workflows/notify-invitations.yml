name: Notify Doctor Invitation and Join Events

on:
  member:
    types: [added]
  workflow_dispatch:
    inputs:
      test_doctor:
        description: 'Doctor username for testing'
        required: false
        default: 'sarah.lind'

jobs:
  notify-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Alert Teams of Member Join
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          # Use manual test input if triggered via workflow_dispatch, otherwise use the real event payload
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DOCTOR="${{ github.event.inputs.test_doctor }}"
          else
            DOCTOR="${{ github.event.member.login }}"
          fi

          REPO="${{ github.repository }}"
          
          JSON_PAYLOAD=$(cat <<EOF
          {
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "🎉 Doctor Joined Repository",
                      "weight": "Bolder",
                      "size": "Medium",
                      "color": "Good"
                    },
                    {
                      "type": "TextBlock",
                      "text": "**@${DOCTOR}** has accepted the invitation and is now an active reviewer on **${REPO}**.",
                      "wrap": true
                    }
                  ]
                }
              }
            ]
          }
          EOF
          )
          
          curl -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "$TEAMS_WEBHOOK_URL"
