name: Clinical question or update
description: Raise a clinical question, propose a framework update, or log a product ask.
title: "[Topic] "
body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below. Everything you choose here is saved in the issue itself,
        so the discussion below stays clean.
        ⚠️ **No patient data.** Never include names, personal numbers, scan results or anything that could identify a member.

  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Clinical question (needs a decision)
        - Framework update (change to an existing document)
        - Product ask (request from product team)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Clinical area
      description: Edit this list to match your framework sections.
      options:
        - Cardiovascular
        - Metabolic & blood
        - Male hormones
        - Female hormones
        - Skin
        - Kidney & liver
        - General / cross-cutting
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High – blocks clinic work or a release
        - Medium – needed this month
        - Low – when time allows
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: Decision needed by
      description: Date in the format YYYY-MM-DD
      placeholder: "2026-11-15"
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: Framework file affected (if known)
      placeholder: "framework/cardiovascular.md – section: Blood pressure"
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Question or proposed change
      description: What needs deciding or changing, and why it matters.
      placeholder: |
        Question: …
        Why it matters: …
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references (optional)
      description: Guidelines, papers or links that support the discussion. You can also drag files here.
    validations:
      required: false

  - type: input
    id: experts
    attributes:
      label: Experts to involve (optional)
      description: Tag them with @username so they are notified.
      placeholder: "@dr-anna @dr-erik"
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This issue contains no patient data.
          required: true
