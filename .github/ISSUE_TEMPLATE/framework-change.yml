name: Framework change request
description: Ask for a change to a framework document. No discussion needed – Claude drafts the change, Tom approves it.
title: "[Change] "
labels: ["change request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when you already know what should change.
        If the change needs discussion first, use **Clinical question or update** instead.
        ⚠️ **No patient data.**

  - type: dropdown
    id: document
    attributes:
      label: Document
      description: Which framework document should change? Edit this list to match your files.
      options:
        - Cardiovascular
        - Metabolic & blood
        - Male hormones
        - Female hormones
        - Skin
        - Kidney & liver
        - General / cross-cutting
        - Other (name it below)
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Copy the sentence or section you want to change from the document and paste it here.
      placeholder: "If total testosterone is borderline, consider a repeat test."
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: What should it say instead?
      description: Write the new text, or describe the change in plain words.
      placeholder: "Repeat with a morning sample taken before 11:00 before discussing treatment."
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why
      description: The reason for the change, and a link to any related question or guideline.
      placeholder: "Agreed in #14. Testosterone is lower later in the day."
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This request contains no patient data.
          required: true

  - type: markdown
    attributes:
      value: |
        **Next step:** after creating this request, add a comment with `@claude draft pr`.
        Claude finds the text in the document, drafts the change, and opens a pull request for Tom to review.
