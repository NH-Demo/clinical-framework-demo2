<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedX Clinical Governance Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const REPO_OWNER = "NH-Demo";
    const REPO_NAME = "clinical-framework-demo2";

    function App() {
      const [issues, setIssues] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [filter, setFilter] = useState('All');

      const fetchIssues = async () => {
        setLoading(true);
        setError(null);
        try {
          const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?state=all&per_page=30`);
          if (!res.ok) throw new Error(`GitHub API returned ${res.status}: ${res.statusText}`);
          const raw = await res.json();
          
          const parsed = raw
            .filter(item => !item.pull_request)
            .map(issue => {
              const isClosed = issue.state === 'closed';
              const isUrgent = issue.labels.some(l => l.name.toLowerCase().includes('urgent') || l.name.toLowerCase().includes('priority'));
              const areaLabel = issue.labels.find(l => l.name.toLowerCase().startsWith('area:') || l.name.toLowerCase().startsWith('clinical:'));

              return {
                id: issue.number,
                title: issue.title,
                isOpen: !isClosed,
                status: isClosed ? 'Approved / Closed' : isUrgent ? 'Overdue' : 'Pending Review',
                category: areaLabel ? areaLabel.name.split(':')[1]?.trim() : 'Guideline Review',
                assignee: issue.assignee ? issue.assignee.login : 'Unassigned',
                email: issue.assignee ? `${issue.assignee.login}@nekohealth.com` : 'tom@nekohealth.com',
                dueDate: issue.milestone?.due_on ? issue.milestone.due_on.split('T')[0] : 'Rolling Review',
                githubUrl: issue.html_url,
                body: issue.body || 'No description provided.'
              };
            });
          setIssues(parsed);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchIssues();
      }, []);

      const getTeamsDeepLink = (issue) => {
        const text = `Hi ${issue.assignee}, quick review reminder on MedX Issue #${issue.id} ("${issue.title}"). Guideline link awaiting clinical sign-off: ${issue.githubUrl}`;
        return `https://teams.microsoft.com/l/chat/0/0?users=${encodeURIComponent(issue.email)}&message=${encodeURIComponent(text)}`;
      };

      const filteredIssues = issues.filter(issue => {
        if (filter === 'All') return true;
        if (filter === 'Open') return issue.isOpen;
        if (filter === 'Closed') return !issue.isOpen;
        return issue.status === filter;
      });

      return (
        <div className="max-w-4xl mx-auto p-6 space-y-6">
          <header className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                  Live GitHub Connected
                </span>
                <span className="text-slate-400 text-xs font-mono">{REPO_OWNER}/{REPO_NAME}</span>
              </div>
              <h1 className="text-2xl font-bold text-slate-900 mt-1">MedX Clinical Review Board</h1>
              <p className="text-sm text-slate-500">Live guideline approval queue and 1-click Teams reminder assistant.</p>
            </div>

            <button
              onClick={fetchIssues}
              disabled={loading}
              className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3.5 py-2 rounded-lg transition-colors flex items-center gap-2"
            >
              <span>↻</span> Refresh
            </button>
          </header>

          <div className="flex gap-2 bg-slate-200/60 p-1 rounded-xl w-fit text-xs font-medium text-slate-600">
            {['All', 'Open', 'Closed'].map(tab => (
              <button
                key={tab}
                onClick={() => setFilter(tab)}
                className={`px-3 py-1.5 rounded-lg transition-all ${
                  filter === tab ? 'bg-white text-slate-900 shadow-sm' : 'hover:text-slate-900'
                }`}
              >
                {tab}
              </button>
            ))}
          </div>

          {loading ? (
            <div className="p-12 text-center text-slate-400 text-sm">Fetching issues from GitHub...</div>
          ) : error ? (
            <div className="bg-rose-50 text-rose-700 p-4 rounded-xl text-sm border border-rose-200">
              Error loading issues: {error}
            </div>
          ) : filteredIssues.length === 0 ? (
            <div className="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-500">
              No issues match the selected filter.
            </div>
          ) : (
            <div className="space-y-4">
              {filteredIssues.map(issue => (
                <div key={issue.id} className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b border-slate-100 pb-3">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="text-xs font-mono font-semibold text-slate-400">#{issue.id}</span>
                      <span className="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-medium">
                        {issue.category}
                      </span>
                      <span className={`text-xs px-2.5 py-0.5 rounded-full font-medium ${
                        !issue.isOpen
                          ? 'bg-slate-100 text-slate-600'
                          : issue.status === 'Overdue'
                          ? 'bg-rose-100 text-rose-700'
                          : 'bg-amber-100 text-amber-700'
                      }`}>
                        {issue.status}
                      </span>
                    </div>

                    <a
                      href={issue.githubUrl}
                      target="_blank"
                      rel="noreferrer"
                      className="text-xs text-indigo-600 hover:text-indigo-800 font-medium"
                    >
                      View in GitHub ↗
                    </a>
                  </div>

                  <div className="mt-3">
                    <h2 className="text-base font-semibold text-slate-900">{issue.title}</h2>
                    <p className="text-xs text-slate-500 line-clamp-2 mt-1">{issue.body}</p>
                  </div>

                  <div className="mt-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pt-2">
                    <div className="flex items-center gap-3 text-xs text-slate-600">
                      <span className="bg-slate-100 px-2 py-1 rounded">👤 {issue.assignee}</span>
                      <span>Target: {issue.dueDate}</span>
                    </div>

                    {issue.isOpen ? (
                      <a
                        href={getTeamsDeepLink(issue)}
                        target="_blank"
                        rel="noreferrer"
                        className="inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3.5 py-2 rounded-lg transition-colors shadow-sm"
                      >
                        <span>💬</span> Nudge in Teams
                      </a>
                    ) : (
                      <span className="text-xs text-emerald-600 font-medium">✓ Sign-off Complete</span>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
