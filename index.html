<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedX Clinical Governance Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const REPO_OWNER = "NH-Demo";
    const REPO_NAME = "clinical-framework-demo2";

    /**
     * Converts any GitHub handle (e.g. "Elena-bui", "sarah_nolan") 
     * to the corporate email format: elena.bui@nekohealth.com
     */
    function resolveCorporateEmail(username) {
      if (!username || username === 'Unassigned') return '';
      const clean = username.toLowerCase().replace(/[^a-z0-9]/g, '.');
      return `${clean}@nekohealth.com`;
    }

    /**
     * Extracts and standardizes dates written in the issue body.
     */
    function parseIssueDeadline(bodyText) {
      if (!bodyText) return null;

      const match = bodyText.match(/(?:due|deadline):\s*([^\r\n]+)/i);
      if (!match) return null;

      const raw = match[1].trim();

      let parsed = new Date(raw);
      if (!isNaN(parsed.getTime())) {
        return parsed.toISOString().split('T')[0];
      }

      const dmyMatch = raw.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
      if (dmyMatch) {
        const day = dmyMatch[1].padStart(2, '0');
        const month = dmyMatch[2].padStart(2, '0');
        const year = dmyMatch[3];
        parsed = new Date(`${year}-${month}-${day}`);
        if (!isNaN(parsed.getTime())) {
          return `${year}-${month}-${day}`;
        }
      }

      return null;
    }

    function App() {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [filter, setFilter] = useState('All');
      const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('medx_current_user') || '');
      const [toastMessage, setToastMessage] = useState(null);

      const fetchData = async () => {
        setLoading(true);
        setError(null);
        try {
          const [issuesRes, pullsRes] = await Promise.all([
            fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?state=open&per_page=30`),
            fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/pulls?state=open&per_page=30`)
          ]);

          if (!issuesRes.ok) throw new Error(`Issues API: ${issuesRes.statusText}`);
          if (!pullsRes.ok) throw new Error(`Pulls API: ${pullsRes.statusText}`);

          const rawIssues = await issuesRes.json();
          const rawPulls = await pullsRes.json();

          const pureIssues = rawIssues
            .filter(item => !item.pull_request)
            .map(issue => {
              const areaLabel = issue.labels.find(l => 
                l.name.toLowerCase().startsWith('area:') || 
                l.name.toLowerCase().startsWith('clinical:')
              );
              const isUrgent = issue.labels.some(l => 
                l.name.toLowerCase().includes('urgent') || 
                l.name.toLowerCase().includes('priority')
              );
              
              const updatedDate = new Date(issue.updated_at);
              const now = new Date();
              const daysInactive = Math.floor((now - updatedDate) / (1000 * 60 * 60 * 24));

              const extractedDueDate = parseIssueDeadline(issue.body);
              const isPastDeadline = extractedDueDate ? new Date(extractedDueDate) < now : false;
              const assigneeLogin = issue.assignee ? issue.assignee.login : 'Unassigned';

              return {
                id: issue.number,
                type: 'Issue',
                title: issue.title,
                status: (isPastDeadline || isUrgent) ? 'Overdue' : 'Pending Review',
                category: areaLabel ? areaLabel.name.split(':')[1]?.trim() : 'Guideline Issue',
                author: issue.user ? issue.user.login : 'Unknown',
                assignee: assigneeLogin,
                email: resolveCorporateEmail(assigneeLogin),
                dueDate: extractedDueDate || (issue.milestone?.due_on ? issue.milestone.due_on.split('T')[0] : 'Rolling Review'),
                url: issue.html_url,
                body: issue.body || 'No description provided.',
                daysInactive: daysInactive,
                isStale: daysInactive >= 3
              };
            });

          const purePulls = rawPulls.map(pr => {
            const reviewer = pr.requested_reviewers && pr.requested_reviewers.length > 0
              ? pr.requested_reviewers[0].login
              : (pr.assignee ? pr.assignee.login : pr.user.login);

            const updatedDate = new Date(pr.updated_at);
            const now = new Date();
            const daysInactive = Math.floor((now - updatedDate) / (1000 * 60 * 60 * 24));

            const extractedDueDate = parseIssueDeadline(pr.body);
            const isPastDeadline = extractedDueDate ? new Date(extractedDueDate) < now : false;

            return {
              id: pr.number,
              type: 'Pull Request',
              title: pr.title,
              status: isPastDeadline ? 'Overdue' : 'PR Sign-off Needed',
              category: 'Guideline PR',
              author: pr.user ? pr.user.login : 'Unknown',
              assignee: reviewer,
              email: resolveCorporateEmail(reviewer),
              dueDate: extractedDueDate || (pr.milestone?.due_on ? pr.milestone.due_on.split('T')[0] : 'Branch Review'),
              url: pr.html_url,
              body: pr.body || 'No PR description provided.',
              daysInactive: daysInactive,
              isStale: daysInactive >= 3
            };
          });

          const combined = [...pureIssues, ...purePulls].sort((a, b) => b.id - a.id);
          setItems(combined);

          // If no current user is saved, automatically infer the most frequent or first active author
          if (!localStorage.getItem('medx_current_user')) {
            const sampleUser = combined.find(i => i.author !== 'Unknown')?.author || '';
            if (sampleUser) {
              setCurrentUser(sampleUser);
              localStorage.setItem('medx_current_user', sampleUser);
            }
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      const handleUserChange = (newUser) => {
        setCurrentUser(newUser);
        localStorage.setItem('medx_current_user', newUser);
      };

      // Solves Teams blank chat: copies text to clipboard and opens chat window
      const handleTeamsNudge = (item) => {
        const reminderText = `Hi ${item.assignee}, quick review reminder on MedX ${item.type} #${item.id} ("${item.title}"). It has been inactive for ${item.daysInactive} days. Here is the clinical guideline link awaiting sign-off: ${item.url}`;

        if (navigator.clipboard) {
          navigator.clipboard.writeText(reminderText).then(() => {
            showToast("Reminder copied! Opening Teams... Press Ctrl+V to send.");
          }).catch(() => {
            showToast("Opening Teams...");
          });
        }

        const teamsUrl = `https://teams.microsoft.com/l/chat/0/0?users=${encodeURIComponent(item.email)}`;
        window.open(teamsUrl, '_blank');
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 4500);
      };

      // Extract unique doctors for the dropdown
      const activeDoctors = Array.from(new Set(
        items.flatMap(item => [item.assignee, item.author]).filter(name => name && name !== 'Unassigned' && name !== 'Unknown')
      )).sort();

      const filteredItems = items.filter(item => {
        if (filter === 'All') return true;
        if (filter === 'Issues') return item.type === 'Issue';
        if (filter === 'PRs') return item.type === 'Pull Request';
        if (filter === 'My Items') return item.assignee === currentUser || item.author === currentUser;
        return true;
      });

      return (
        <div className="max-w-4xl mx-auto p-6 space-y-6">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-lg border border-slate-700 flex items-center gap-2 animate-bounce">
              <span>📋</span> {toastMessage}
            </div>
          )}

          <header className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                  Live GitHub Connected
                </span>
                <span className="text-slate-400 text-xs font-mono">{REPO_OWNER}/{REPO_NAME}</span>
              </div>
              <h1 className="text-2xl font-bold text-slate-900 mt-1">MedX Clinical Review Board</h1>
              <p className="text-sm text-slate-500">Live tracker for pending Issues and Pull Request sign-offs.</p>
            </div>

            <div className="flex items-center gap-3">
              {/* Dynamic User Selector */}
              <div className="flex flex-col text-right">
                <label className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Current Doctor</label>
                <select
                  value={currentUser}
                  onChange={(e) => handleUserChange(e.target.value)}
                  className="text-xs bg-slate-100 border border-slate-200 rounded-lg px-2.5 py-1.5 font-medium text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500"
                >
                  <option value="">Select profile...</option>
                  {activeDoctors.map(doc => (
                    <option key={doc} value={doc}>{doc}</option>
                  ))}
                </select>
              </div>

              <button
                onClick={fetchData}
                disabled={loading}
                className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3.5 py-2 rounded-lg transition-colors flex items-center gap-2 mt-3"
              >
                <span>↻</span> Refresh
              </button>
            </div>
          </header>

          {/* Quick Filter Bar */}
          <div className="flex gap-2 bg-slate-200/60 p-1 rounded-xl w-fit text-xs font-medium text-slate-600">
            {['All', 'Issues', 'PRs', 'My Items'].map(tab => (
              <button
                key={tab}
                onClick={() => setFilter(tab)}
                className={`px-3 py-1.5 rounded-lg transition-all ${
                  filter === tab ? 'bg-white text-slate-900 shadow-sm font-semibold' : 'hover:text-slate-900'
                }`}
              >
                {tab}
              </button>
            ))}
          </div>

          {loading ? (
            <div className="p-12 text-center text-slate-400 text-sm">Fetching Issues and PRs from GitHub...</div>
          ) : error ? (
            <div className="bg-rose-50 text-rose-700 p-4 rounded-xl text-sm border border-rose-200">
              Error loading: {error}
            </div>
          ) : filteredItems.length === 0 ? (
            <div className="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-500">
              No matching items found.
            </div>
          ) : (
            <div className="space-y-4">
              {filteredItems.map(item => {
                const isMyItem = currentUser && (item.assignee === currentUser || item.author === currentUser);

                return (
                  <div 
                    key={`${item.type}-${item.id}`} 
                    className={`bg-white rounded-xl border p-5 shadow-sm transition-all ${
                      item.isStale 
                        ? 'border-amber-300 border-l-4 border-l-amber-500' 
                        : isMyItem 
                          ? 'border-indigo-300 border-l-4 border-l-indigo-600' 
                          : 'border-slate-200'
                    }`}
                  >
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b border-slate-100 pb-3">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className={`text-xs px-2 py-0.5 rounded font-mono font-semibold ${
                          item.type === 'Pull Request' ? 'bg-purple-100 text-purple-700' : 'bg-slate-100 text-slate-700'
                        }`}>
                          {item.type === 'Pull Request' ? 'PR' : 'Issue'} #{item.id}
                        </span>
                        
                        <span className="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-medium">
                          {item.category}
                        </span>

                        {/* Identity Badge if user is author/assignee */}
                        {isMyItem && (
                          <span className="text-xs bg-indigo-100 text-indigo-700 font-semibold px-2 py-0.5 rounded-full border border-indigo-200">
                            👤 You ({item.assignee === currentUser ? 'Assigned' : 'Created'})
                          </span>
                        )}
                        
                        {/* Dynamic Status Tag */}
                        <span className={`text-xs px-2.5 py-0.5 rounded-full font-medium ${
                          item.status === 'Overdue'
                            ? 'bg-rose-100 text-rose-700 font-semibold border border-rose-200'
                            : 'bg-amber-100 text-amber-700'
                        }`}>
                          {item.status === 'Overdue' ? '🚨 Overdue' : item.status}
                        </span>

                        {/* Stale Inactivity Indicator */}
                        {item.isStale && (
                          <span className="text-xs px-2.5 py-0.5 rounded-full font-semibold bg-red-50 text-red-700 border border-red-200 flex items-center gap-1">
                            <span>⚠️</span> Inactive {item.daysInactive}d
                          </span>
                        )}
                      </div>

                      <a
                        href={item.url}
                        target="_blank"
                        rel="noreferrer"
                        className="text-xs text-indigo-600 hover:text-indigo-800 font-medium"
                      >
                        View on GitHub ↗
                      </a>
                    </div>

                    <div className="mt-3">
                      <h2 className="text-base font-semibold text-slate-900">{item.title}</h2>
                      <p className="text-xs text-slate-500 line-clamp-2 mt-1">{item.body}</p>
                    </div>

                    <div className="mt-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pt-2">
                      <div className="flex items-center gap-3 text-xs text-slate-600 flex-wrap">
                        <span className="bg-slate-100 px-2 py-1 rounded">
                          👤 Reviewer: <span className="font-medium text-slate-800">{item.assignee}</span>
                        </span>
                        <span className="text-slate-400">Created by: {item.author}</span>
                        <span>Target: {item.dueDate}</span>
                      </div>

                      <button
                        onClick={() => handleTeamsNudge(item)}
                        className={`inline-flex items-center gap-1.5 text-xs font-medium px-3.5 py-2 rounded-lg transition-colors shadow-sm ${
                          item.isStale
                            ? 'bg-amber-600 hover:bg-amber-700 text-white'
                            : 'bg-indigo-600 hover:bg-indigo-700 text-white'
                        }`}
                      >
                        <span>💬</span> {item.isStale ? 'Nudge Inactive Doctor' : 'Nudge in Teams'}
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
