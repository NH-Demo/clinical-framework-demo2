<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedX Clinical Governance & Reminder Hub</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel for in-browser JSX transformation -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons Vanilla CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 antialiased selection:bg-emerald-100 selection:text-emerald-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // Configurable repository targets
    const REPO_OWNER = "NH-Demo";
    const REPO_NAME = "clinical-framework-demo2";

    // Known clinician email mapping fallback
    const KNOWN_CLINICIANS = {
      "default": "clinical.ops@nekohealth.com",
      "tom": "tom@nekohealth.com",
    };

    function App() {
      const [issues, setIssues] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [activeFilter, setActiveFilter] = useState("Open");
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [lastRefreshed, setLastRefreshed] = useState(null);

      const fetchIssues = useCallback(async () => {
        setLoading(true);
        setError(null);
        try {
          const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?state=all&per_page=50`);
          if (!res.ok) {
            throw new Error(`GitHub API returned status ${res.status}: ${res.statusText}`);
          }
          const rawData = await res.json();
          
          // Parse only clinical issues (skip PRs)
          const parsed = rawData
            .filter(item => !item.pull_request)
            .map(item => {
              const isOpen = item.state === "open";
              const labelNames = item.labels.map(l => (typeof l === 'object' ? l.name : l));
              
              const isUrgent = labelNames.some(l => 
                l.toLowerCase().includes("urgent") || 
                l.toLowerCase().includes("priority") ||
                l.toLowerCase().includes("critical")
              );

              // Detect area category label
              const areaTag = labelNames.find(l => 
                l.toLowerCase().startsWith("area:") || 
                l.toLowerCase().startsWith("domain:") ||
                l.toLowerCase().startsWith("clinical:")
              );
              const category = areaTag ? areaTag.split(":")[1].trim() : "Core Guideline";

              // Determine assignee details
              const assigneeLogin = item.assignee ? item.assignee.login : null;
              const assigneeEmail = assigneeLogin && KNOWN_CLINICIANS[assigneeLogin.toLowerCase()] 
                ? KNOWN_CLINICIANS[assigneeLogin.toLowerCase()] 
                : (assigneeLogin ? `${assigneeLogin}@nekohealth.com` : "clinical-review@nekohealth.com");

              // Compute status label
              let statusLabel = isOpen ? (isUrgent ? "Overdue / Urgent" : "Pending Review") : "Approved / Closed";

              return {
                id: item.number,
                title: item.title,
                body: item.body || "No clinical brief provided.",
                isOpen,
                isUrgent,
                status: statusLabel,
                category,
                assignee: assigneeLogin || "Unassigned",
                assigneeEmail,
                assigneeAvatar: item.assignee?.avatar_url || null,
                dueDate: item.milestone?.due_on ? item.milestone.due_on.split("T")[0] : "Rolling Review",
                milestoneTitle: item.milestone?.title || null,
                githubUrl: item.html_url,
                labels: labelNames,
                updatedAt: new Date(item.updated_at).toLocaleDateString("en-SE"),
              };
            });

          setIssues(parsed);
          setLastRefreshed(new Date().toLocaleTimeString());
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        fetchIssues();
      }, [fetchIssues]);

      // Re-trigger Lucide icon replacement when DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [issues, loading, activeFilter, searchQuery]);

      const categories = useMemo(() => {
        const unique = new Set(issues.map(i => i.category));
        return ["All", ...Array.from(unique)];
      }, [issues]);

      const filteredIssues = useMemo(() => {
        return issues.filter(item => {
          // Status filter
          if (activeFilter === "Open" && !item.isOpen) return false;
          if (activeFilter === "Closed" && item.isOpen) return false;
          if (activeFilter === "Overdue" && (!item.isOpen || !item.isUrgent)) return false;

          // Category filter
          if (selectedCategory !== "All" && item.category !== selectedCategory) return false;

          // Search term
          if (searchQuery.trim() !== "") {
            const query = searchQuery.toLowerCase();
            const matchTitle = item.title.toLowerCase().includes(query);
            const matchBody = item.body.toLowerCase().includes(query);
            const matchAssignee = item.assignee.toLowerCase().includes(query);
            const matchId = String(item.id).includes(query);
            if (!matchTitle && !matchBody && !matchAssignee && !matchId) return false;
          }

          return true;
        });
      }, [issues, activeFilter, selectedCategory, searchQuery]);

      const metrics = useMemo(() => {
        const total = issues.length;
        const open = issues.filter(i => i.isOpen).length;
        const closed = issues.filter(i => !i.isOpen).length;
        const urgent = issues.filter(i => i.isOpen && i.isUrgent).length;
        return { total, open, closed, urgent };
      }, [issues]);

      // Generate 1-click Microsoft Teams deep link URL
      const generateTeamsLink = (issue) => {
        const recipient = issue.assigneeEmail;
        const subject = `MedX Guideline Review #${issue.id}`;
        const messageText = `Hi ${issue.assignee === 'Unassigned' ? 'Team' : issue.assignee},\n\nQuick review reminder for MedX Issue #${issue.id} ("${issue.title}").\n\nPlease find the guideline pull request and review thread here:\n${issue.githubUrl}\n\nClinical Governance Status: ${issue.status}.`;
        
        return `https://teams.microsoft.com/l/chat/0/0?users=${encodeURIComponent(recipient)}&message=${encodeURIComponent(messageText)}`;
      };

      return (
        <div className="max-w-6xl mx-auto px-4 py-8">
          {}
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-6 border-b border-slate-200">
            <div>
              <div className="flex items-center gap-2">
                <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span>
                  Neko MedX Pilot
                </span>
                <span className="text-xs font-mono text-slate-500 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">
                  {REPO_OWNER}/{REPO_NAME}
                </span>
              </div>
              <h1 className="text-2xl md:text-3xl font-bold tracking-tight text-slate-900 mt-2">
                Clinical Governance & Review Assistant
              </h1>
              <p className="text-sm text-slate-600 mt-1">
                Centralized guideline offshoot tracking, sign-off status, and instant Teams escalation.
              </p>
            </div>

            <div className="flex items-center gap-3">
              <a
                href={`https://github.com/${REPO_OWNER}/${REPO_NAME}`}
                target="_blank"
                rel="noreferrer"
                className="inline-flex items-center gap-2 px-3.5 py-2 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg shadow-sm hover:bg-slate-50 transition-colors"
              >
                <i data-lucide="github" className="w-4 h-4 text-slate-700"></i>
                GitHub Repo
              </a>
              <button
                onClick={fetchIssues}
                disabled={loading}
                className="inline-flex items-center gap-2 px-4 py-2 text-xs font-semibold text-white bg-slate-900 hover:bg-slate-800 rounded-lg shadow-sm transition-colors disabled:opacity-50"
              >
                <i data-lucide="refresh-cw" className={`w-3.5 h-3.5 ${loading ? 'animate-spin' : ''}`}></i>
                Sync Feed
              </button>
            </div>
          </header>

          {}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Guidelines</span>
              <div className="text-2xl font-bold text-slate-900 mt-1">{metrics.total}</div>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs font-medium text-amber-600 uppercase tracking-wider">Pending Review</span>
              <div className="text-2xl font-bold text-amber-600 mt-1">{metrics.open}</div>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs font-medium text-rose-600 uppercase tracking-wider">Urgent Escalations</span>
              <div className="text-2xl font-bold text-rose-600 mt-1">{metrics.urgent}</div>
            </div>
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span className="text-xs font-medium text-emerald-600 uppercase tracking-wider">Approved & Audit Ready</span>
              <div className="text-2xl font-bold text-emerald-600 mt-1">{metrics.closed}</div>
            </div>
          </div>

          {}
          <div className="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between mt-6 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
            <div className="relative flex-1">
              <i data-lucide="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search by guideline title, doctor, issue ID..."
                className="w-full pl-9 pr-4 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all"
              />
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <div className="flex bg-slate-100 p-1 rounded-lg text-xs font-medium text-slate-600">
                {["Open", "Overdue", "Closed", "All"].map(status => (
                  <button
                    key={status}
                    onClick={() => setActiveFilter(status)}
                    className={`px-3 py-1.5 rounded-md transition-all ${
                      activeFilter === status 
                        ? 'bg-white text-slate-900 shadow-sm font-semibold' 
                        : 'hover:text-slate-900'
                    }`}
                  >
                    {status}
                  </button>
                ))}
              </div>

              {categories.length > 2 && (
                <select
                  value={selectedCategory}
                  onChange={(e) => setSelectedCategory(e.target.value)}
                  className="px-3 py-1.5 bg-slate-50 border border-slate-200 text-xs font-medium rounded-lg text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                >
                  {categories.map(cat => (
                    <option key={cat} value={cat}>{cat}</option>
                  ))}
                </select>
              )}
            </div>
          </div>

          {}
          <main className="mt-6">
            {loading ? (
              <div className="py-20 text-center bg-white rounded-2xl border border-slate-200 shadow-sm">
                <i data-lucide="loader" className="w-8 h-8 mx-auto text-emerald-600 animate-spin"></i>
                <h3 className="text-sm font-medium text-slate-700 mt-3">Connecting to GitHub...</h3>
                <p className="text-xs text-slate-400 mt-1">Fetching live clinical governance issues from {REPO_NAME}</p>
              </div>
            ) : error ? (
              <div className="p-6 bg-rose-50 border border-rose-200 rounded-2xl text-center">
                <i data-lucide="alert-triangle" className="w-8 h-8 mx-auto text-rose-600 mb-2"></i>
                <h3 className="text-sm font-bold text-rose-900">Unable to Fetch Repository</h3>
                <p className="text-xs text-rose-700 mt-1 max-w-md mx-auto">{error}</p>
                <button
                  onClick={fetchIssues}
                  className="mt-4 px-4 py-1.5 text-xs font-semibold bg-rose-600 text-white rounded-lg hover:bg-rose-700 transition"
                >
                  Retry Connection
                </button>
              </div>
            ) : filteredIssues.length === 0 ? (
              <div className="py-16 text-center bg-white rounded-2xl border border-slate-200 shadow-sm">
                <i data-lucide="inbox" className="w-8 h-8 mx-auto text-slate-300"></i>
                <h3 className="text-sm font-semibold text-slate-700 mt-2">No matching guidelines found</h3>
                <p className="text-xs text-slate-500 mt-1">Try modifying your filter or search query.</p>
              </div>
            ) : (
              <div className="space-y-4">
                {filteredIssues.map(issue => (
                  <div
                    key={issue.id}
                    className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:border-slate-300 transition-all flex flex-col justify-between"
                  >
                    <div>
                      {/* Top Meta Line */}
                      <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className="font-mono text-xs font-semibold text-slate-400">#{issue.id}</span>
                          <span className="text-xs font-medium bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-full border border-slate-200">
                            {issue.category}
                          </span>
                          
                          {/* Status Badge */}
                          <span className={`inline-flex items-center gap-1 text-xs px-2.5 py-0.5 rounded-full font-semibold ${
                            !issue.isOpen
                              ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                              : issue.isUrgent
                              ? 'bg-rose-50 text-rose-700 border border-rose-200'
                              : 'bg-amber-50 text-amber-700 border border-amber-200'
                          }`}>
                            <i data-lucide={!issue.isOpen ? "check-circle" : (issue.isUrgent ? "alert-circle" : "clock")} className="w-3 h-3"></i>
                            {issue.status}
                          </span>
                        </div>

                        <a
                          href={issue.githubUrl}
                          target="_blank"
                          rel="noreferrer"
                          className="inline-flex items-center gap-1 text-xs text-slate-500 hover:text-slate-900 transition-colors"
                        >
                          View in Git <i data-lucide="external-link" className="w-3 h-3"></i>
                        </a>
                      </div>

                      {/* Content Body */}
                      <div className="mt-3">
                        <h2 className="text-base font-semibold text-slate-900 hover:text-emerald-700 transition-colors">
                          <a href={issue.githubUrl} target="_blank" rel="noreferrer">
                            {issue.title}
                          </a>
                        </h2>
                        <p className="text-xs text-slate-600 line-clamp-2 mt-1 leading-relaxed">
                          {issue.body}
                        </p>
                      </div>
                    </div>

                    {/* Bottom Action Footer */}
                    <div className="mt-5 pt-3 border-t border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                      <div className="flex items-center gap-4 text-xs text-slate-500">
                        <div className="flex items-center gap-1.5">
                          {issue.assigneeAvatar ? (
                            <img src={issue.assigneeAvatar} alt="" className="w-4 h-4 rounded-full" />
                          ) : (
                            <i data-lucide="user" className="w-3.5 h-3.5 text-slate-400"></i>
                          )}
                          <span className="font-medium text-slate-700">@{issue.assignee}</span>
                        </div>
                        <div className="flex items-center gap-1">
                          <i data-lucide="calendar" className="w-3.5 h-3.5 text-slate-400"></i>
                          <span>{issue.dueDate}</span>
                        </div>
                      </div>

                      {issue.isOpen ? (
                        <a
                          href={generateTeamsLink(issue)}
                          target="_blank"
                          rel="noreferrer"
                          className="inline-flex items-center gap-2 px-3.5 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 rounded-lg shadow-sm transition-all w-full sm:w-auto justify-center"
                        >
                          <i data-lucide="send" className="w-3 h-3"></i>
                          Nudge in Teams
                        </a>
                      ) : (
                        <span className="inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200">
                          <i data-lucide="check" className="w-3.5 h-3.5 text-emerald-600"></i>
                          Audit Logged
                        </span>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {}
          <footer className="mt-12 text-center text-xs text-slate-400 border-t border-slate-200 pt-6">
            <p>Neko Health MedX Governance Assistant &bull; Synchronized via GitHub REST API</p>
            {lastRef
